<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAMA - Jornadas do Design V07</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #menuToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            cursor: pointer;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #menuToggle:hover { background: rgba(0, 0, 0, 0.85); }
        #menuToggle span {
            display: block;
            width: 16px;
            height: 2px;
            background: white;
            border-radius: 1px;
            transition: transform 0.3s, opacity 0.3s;
        }
        #menuToggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        #menuToggle.open span:nth-child(2) { opacity: 0; }
        #menuToggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

        #controls {
            position: absolute;
            top: 52px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            z-index: 150;
            min-width: 180px;
            max-height: calc(100vh - 65px);
            overflow-y: auto;
            transform: translateX(calc(100% + 20px));
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        #controls.visible {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }
        #controls::-webkit-scrollbar { width: 4px; }
        #controls::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        .control-group { margin-bottom: 8px; }

        label {
            display: block;
            margin-bottom: 2px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 2px;
            height: 18px;
        }

        .value-display {
            text-align: right;
            font-size: 11px;
            margin-top: 1px;
            font-weight: bold;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 7px;
            background: #E63946;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.5;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .separator {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 10px 0;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            margin-top: 2px;
        }
        select option {
            background: #1a1a1a;
            color: white;
        }
    </style>
</head>
<body>
    <button id="menuToggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div id="controls">
        <div class="control-group">
            <label>Efeito Mao</label>
            <select id="handEffect">
                <option value="wireframe">Wireframe</option>
                <option value="skeleton">Esqueleto</option>
            </select>
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>Elasticidade</label>
            <input type="range" id="elasticity" min="0.02" max="0.15" step="0.01" value="0.08">
            <div class="value-display" id="elasticity-value">0.08</div>
        </div>

        <div class="control-group">
            <label>Densidade de Malha</label>
            <input type="range" id="gridDensity" min="15" max="35" step="2" value="25">
            <div class="value-display" id="density-value">25</div>
        </div>

        <div class="control-group">
            <label>Raio de Captura</label>
            <input type="range" id="captureRadius" min="30" max="100" step="5" value="60">
            <div class="value-display" id="capture-value">60</div>
        </div>

        <div class="control-group">
            <label>Opacidade Video</label>
            <input type="range" id="videoOpacity" min="0" max="100" step="5" value="50">
            <div class="value-display" id="opacity-value">50%</div>
        </div>

        <div class="control-group">
            <label>Opacidade Tracking</label>
            <input type="range" id="trackingOpacity" min="0" max="100" step="5" value="60">
            <div class="value-display" id="tracking-opacity-value">60%</div>
        </div>

        <div class="control-group">
            <button id="enableCamera">Ativar Camera</button>
        </div>
    </div>

    <div id="status">Clica "Ativar Camera" - Move as maos para interagir</div>

    <div class="canvas-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="mainCanvas"></canvas>
    </div>

        const JORNADAS_CENTER = { x: 1087, y: 648 };
        const DODESIGN_CENTER = { x: 1089, y: 683 };

        // ============================================
        // POINT CLASS + GRID
        // ============================================
        class Point {
            constructor(x, y, col, row) {
                this.x = x; this.y = y; this.z = 0;
                this.originalX = x; this.originalY = y; this.originalZ = 0;
                this.vx = 0; this.vy = 0; this.vz = 0;
                this.col = col; this.row = row;
                this.attachedToFinger = false;
                this.attachedFingerX = 0; this.attachedFingerY = 0; this.attachedFingerZ = 0;
            }
            update() {
                if (this.attachedToFinger) {
                    this.x = this.attachedFingerX; this.y = this.attachedFingerY; this.z = this.attachedFingerZ;
                    this.vx = 0; this.vy = 0; this.vz = 0;
                } else {
                    let fx = (this.originalX - this.x) * CONFIG.elasticity;
                    let fy = (this.originalY - this.y) * CONFIG.elasticity;
                    let fz = (this.originalZ - this.z) * CONFIG.elasticity * 2;
                    this.vx = (this.vx + fx) * CONFIG.damping;
                    this.vy = (this.vy + fy) * CONFIG.damping;
                    this.vz = (this.vz + fz) * CONFIG.damping * 0.9;
                    this.x += this.vx; this.y += this.vy; this.z += this.vz;
                }
            }
            reset() { this.attachedToFinger = false; }
        }

        function createGrid() {
            points = [];
            let scale = Math.min(canvas.width / SVG_AREA.width, canvas.height / SVG_AREA.height) * 0.8;
            let svgW = SVG_AREA.width * scale, svgH = SVG_AREA.height * scale;
            let offsetX = (canvas.width - svgW) / 2, offsetY = (canvas.height - svgH) / 2;
            cols = CONFIG.gridDensity;
            rows = Math.floor(cols * (svgH / svgW));
            let spacingX = svgW / cols, spacingY = svgH / rows;
            for (let i = 0; i <= cols; i++) {
                points[i] = [];
                for (let j = 0; j <= rows; j++) {
                    points[i][j] = new Point(offsetX + i * spacingX, offsetY + j * spacingY, i, j);
                }
            }
        }

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
            return { r: parseInt(hex.substring(0, 2), 16), g: parseInt(hex.substring(2, 4), 16), b: parseInt(hex.substring(4, 6), 16) };
        }

        function getDistortedPoint(x, y) {
            if (cols === 0 || rows === 0 || !points[0]) return {x, y, z: 0};
            let minX = points[0][0].originalX, minY = points[0][0].originalY;
            let maxX = points[cols][0].originalX, maxY = points[0][rows].originalY;
            if (x < minX || x > maxX || y < minY || y > maxY) return {x, y, z: 0};
            let u = (x - minX) / (maxX - minX) * cols, v = (y - minY) / (maxY - minY) * rows;
            let i = Math.max(0, Math.min(cols - 1, Math.floor(u))), j = Math.max(0, Math.min(rows - 1, Math.floor(v)));
            let lu = Math.max(0, Math.min(1, u - i)), lv = Math.max(0, Math.min(1, v - j));
            let p1 = points[i][j], p2 = points[i+1][j], p3 = points[i+1][j+1], p4 = points[i][j+1];
            let tx = p1.x + lu * (p2.x - p1.x), ty = p1.y + lu * (p2.y - p1.y), tz = p1.z + lu * (p2.z - p1.z);
            let bx = p4.x + lu * (p3.x - p4.x), by = p4.y + lu * (p3.y - p4.y), bz = p4.z + lu * (p3.z - p4.z);
            return { x: tx + lv * (bx - tx), y: ty + lv * (by - ty), z: tz + lv * (bz - tz) };
        }

        // ============================================
        // HAND EFFECT RENDERERS
        // ============================================
        function getHandScale(lm) {
            return Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) / 150;
        }

        // --- WIREFRAME ---
        function drawEffectWireframe(landmarks) {
            const opacity = CONFIG.trackingOpacity;
            ctx.strokeStyle = `rgba(0, 255, 0, ${opacity})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let [a, b] of HAND_CONNECTIONS) {
                ctx.moveTo(landmarks[a].x, landmarks[a].y);
                ctx.lineTo(landmarks[b].x, landmarks[b].y);
            }
            ctx.stroke();

            for (let idx of [4, 8, 12, 16, 20]) {
                let z = landmarks[idx].z, size = 12 + z * 40;
                let alpha = (0.7 + z * 0.3) * opacity;
                ctx.fillStyle = `rgba(255, 68, 68, ${Math.max(0.3, Math.min(1, alpha))})`;
                ctx.beginPath(); ctx.arc(landmarks[idx].x, landmarks[idx].y, Math.max(6, size), 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = `rgba(255, 200, 50, ${Math.max(0.2, Math.min(0.8, alpha * 0.5))})`;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(landmarks[idx].x, landmarks[idx].y, Math.max(10, size + 5), 0, Math.PI * 2); ctx.stroke();
            }
            ctx.fillStyle = `rgba(68, 136, 255, ${opacity})`;
            ctx.beginPath(); ctx.arc(landmarks[0].x, landmarks[0].y, 10, 0, Math.PI * 2); ctx.fill();
        }

        // --- SKELETON (all white) ---
        function drawEffectSkeleton(landmarks) {
            const s = getHandScale(landmarks);

            ctx.save();
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;

            for (let [a, b] of HAND_CONNECTIONS) {
                ctx.beginPath();
                ctx.moveTo(landmarks[a].x, landmarks[a].y);
                ctx.lineTo(landmarks[b].x, landmarks[b].y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = Math.max(4, 8 * s);
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(landmarks[a].x, landmarks[a].y);
                ctx.lineTo(landmarks[b].x, landmarks[b].y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.lineWidth = Math.max(2, 3 * s);
                ctx.stroke();
            }

            for (let i = 0; i < 21; i++) {
                let isTip = [4, 8, 12, 16, 20].includes(i);
                let isBase = [0, 1, 5, 9, 13, 17].includes(i);
                let r = isTip ? 6 * s : (isBase ? 7 * s : 4 * s);
                ctx.beginPath();
                ctx.arc(landmarks[i].x, landmarks[i].y, Math.max(3, r), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            ctx.restore();
        }

        // ============================================
        // MAIN DRAW HAND DISPATCHER
        // ============================================
        function drawHands() {
            for (let handIdx = 0; handIdx < allHandLandmarks.length; handIdx++) {
                let lm = allHandLandmarks[handIdx];
                switch (currentEffect) {
                    case 'wireframe': drawEffectWireframe(lm); break;
                    case 'skeleton': drawEffectSkeleton(lm); break;
                    default: drawEffectWireframe(lm);
                }
            }

            // Capture zones (only for wireframe)
            if (currentEffect === 'wireframe') {
                ctx.strokeStyle = `rgba(255, 200, 50, ${CONFIG.trackingOpacity * 0.5})`;
                ctx.lineWidth = 2;
                for (let finger of allFingers) {
                    ctx.beginPath();
                    ctx.arc(finger.x, finger.y, CONFIG.captureRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // ============================================
        // RENDER
        // ============================================
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i <= cols; i++)
                for (let j = 0; j <= rows; j++)
                    points[i][j].reset();

            for (let finger of allFingers) {
                for (let i = 0; i <= cols; i++) {
                    for (let j = 0; j <= rows; j++) {
                        let p = points[i][j];
                        let dist = Math.sqrt((p.x - finger.x) ** 2 + (p.y - finger.y) ** 2);
                        if (dist < CONFIG.captureRadius) {
                            p.attachedToFinger = true;
                            p.attachedFingerX = finger.x;
                            p.attachedFingerY = finger.y;
                            p.attachedFingerZ = finger.z * 500;
                        }
                    }
                }
            }

            for (let i = 0; i <= cols; i++)
                for (let j = 0; j <= rows; j++)
                    points[i][j].update();

            let scale = Math.min(canvas.width / SVG_AREA.width, canvas.height / SVG_AREA.height) * 0.8;
            let svgW = SVG_AREA.width * scale, svgH = SVG_AREA.height * scale;
            let offsetX = (canvas.width - svgW) / 2, offsetY = (canvas.height - svgH) / 2;

            drawDistortedPolylines(offsetX, offsetY, svgW, svgH, scale);
            drawDistortedBorder(offsetX, offsetY, svgW, svgH);
            drawDistortedSubtitle(offsetX, offsetY, scale);
            drawDistortedLetters(offsetX, offsetY, scale);
            drawHands();
        }

        // ============================================
        // SVG DRAW FUNCTIONS
        // ============================================
        function drawDistortedPolylines(offsetX, offsetY, svgW, svgH, scale) {
            const SUB = 30;
            for (let polyline of svgPolylines) {
                let coords = polyline.points.trim().split(/\s+/), rawPts = [];
                for (let i = 0; i < coords.length; i += 2) rawPts.push({ x: parseFloat(coords[i]), y: parseFloat(coords[i+1]) });
                let pts = [];
                for (let seg = 0; seg < rawPts.length - 1; seg++) {
                    let isLast = (seg === rawPts.length - 2), steps = SUB;
                    for (let s = 0; s <= (isLast ? steps : steps - 1); s++) {
                        let t = s / steps;
                        let svgX = rawPts[seg].x + (rawPts[seg+1].x - rawPts[seg].x) * t;
                        let svgY = rawPts[seg].y + (rawPts[seg+1].y - rawPts[seg].y) * t;
                        pts.push(getDistortedPoint((svgX / SVG_AREA.width) * svgW + offsetX, (svgY / SVG_AREA.height) * svgH + offsetY));
                    }
                }
                if (pts.length < 2) continue;
                const rgb = hexToRgb(polyline.color);
                for (let i = 1; i < pts.length; i++) {
                    let nZ = Math.max(0, Math.min(1, ((pts[i-1].z + pts[i].z) / 2 + 150) / 300));
                    ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${Math.min(1, 0.5 + nZ)})`;
                    ctx.lineWidth = 4 * (0.5 + nZ);
                    if (nZ > 0.7) { ctx.shadowColor = polyline.color; ctx.shadowBlur = (nZ - 0.7) * 20; } else { ctx.shadowBlur = 0; }
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            }
        }

        function drawDistortedBorder(offsetX, offsetY, svgW, svgH) {
            const corners = [{svgX:0,svgY:0},{svgX:SVG_AREA.width,svgY:0},{svgX:SVG_AREA.width,svgY:SVG_AREA.height},{svgX:0,svgY:SVG_AREA.height}];
            const sub = 20, bPts = [];
            for (let edge = 0; edge < 4; edge++) {
                const c1 = corners[edge], c2 = corners[(edge+1)%4];
                for (let s = 0; s < sub; s++) {
                    let t = s / sub;
                    bPts.push(getDistortedPoint((c1.svgX + (c2.svgX-c1.svgX)*t) / SVG_AREA.width * svgW + offsetX, (c1.svgY + (c2.svgY-c1.svgY)*t) / SVG_AREA.height * svgH + offsetY));
                }
            }
            if (bPts.length > 0) {
                ctx.beginPath(); ctx.moveTo(bPts[0].x, bPts[0].y);
                for (let i = 1; i < bPts.length; i++) ctx.lineTo(bPts[i].x, bPts[i].y);
                ctx.closePath(); ctx.strokeStyle = '#f0ece6'; ctx.lineWidth = 4; ctx.stroke();
            }
        }

        function drawDistortedSubtitle(offsetX, offsetY, scale) {
            drawPath2DDistorted(jornadasPath, JORNADAS_CENTER.x, JORNADAS_CENTER.y, offsetX, offsetY, scale, false);
            drawPath2DDistorted(doDesignPath, DODESIGN_CENTER.x, DODESIGN_CENTER.y, offsetX, offsetY, scale, false);
        }

        function drawDistortedLetters(offsetX, offsetY, scale) {
            for (let l of tramaPath2Ds) drawPath2DDistorted(l.path, l.cx, l.cy, offsetX, offsetY, scale, true);
        }

        function drawPath2DDistorted(path, svgCX, svgCY, offsetX, offsetY, scale, hasStroke) {
            let cX = offsetX + svgCX * scale, cY = offsetY + svgCY * scale;
            let d = getDistortedPoint(cX, cY), dx = d.x - cX, dy = d.y - cY;
            let nZ = Math.max(0, Math.min(1, (d.z + 150) / 300)), op = Math.min(1, 0.5 + nZ);
            ctx.save(); ctx.translate(offsetX + dx, offsetY + dy); ctx.scale(scale, scale);
            ctx.fillStyle = `rgba(255,255,255,${op})`; ctx.fill(path);
            if (hasStroke) { ctx.strokeStyle = `rgba(255,255,255,${op})`; ctx.lineWidth = 0.68; ctx.stroke(path); }
            ctx.restore();
        }

        // ============================================
        // HAND TRACKING
        // ============================================
        async function startCamera() {
            const btn = document.getElementById('enableCamera');
            btn.disabled = true; btn.textContent = 'A iniciar...';
            document.getElementById('status').textContent = 'A iniciar camera...';
            try {
                // Safari fix: Pre-check camera permission with explicit getUserMedia
                // Safari requires this explicit call before MediaPipe Camera can access the stream
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('O teu browser nao suporta acesso a camera. Usa Chrome ou Safari recente.');
                }

                // Check HTTPS requirement (Safari and modern browsers require secure context)
                if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                    console.warn('Camera access may require HTTPS. Current protocol:', location.protocol);
                }

                // Request camera permission explicitly first (critical for Safari)
                let preStream;
                try {
                    preStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                } catch (permErr) {
                    if (permErr.name === 'NotAllowedError') {
                        throw new Error('Permissao de camera negada. Vai a Definicoes do browser e permite acesso a camera para este site.');
                    } else if (permErr.name === 'NotFoundError') {
                        throw new Error('Nenhuma camera encontrada. Verifica se o dispositivo tem camera.');
                    } else if (permErr.name === 'NotReadableError') {
                        throw new Error('Camera em uso por outra aplicacao. Fecha outras apps que usem a camera.');
                    } else {
                        throw permErr;
                    }
                }
                // Stop the pre-check stream (MediaPipe Camera will create its own)
                preStream.getTracks().forEach(t => t.stop());

                hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5 });
                hands.onResults(onHandResults);
                camera = new Camera(webcam, {
                    onFrame: async () => { if (isRunning) await hands.send({ image: webcam }); },
                    width: 1280, height: 720
                });
                await camera.start();
                isRunning = true;
                document.getElementById('status').textContent = 'Camera ativa - Move as maos!';
                btn.textContent = '\u2713 Ativa'; btn.style.background = '#06FFA5';
                btn.disabled = false; btn.onclick = stopCamera;
                animate();
            } catch (error) {
                console.error('Erro camera:', error);
                document.getElementById('status').textContent = 'Erro: ' + error.message;
                btn.textContent = 'Tentar Novamente'; btn.disabled = false;
            }
        }

        function stopCamera() {
            isRunning = false; if (camera) camera.stop();
            document.getElementById('status').textContent = 'Camera desligada';
            const btn = document.getElementById('enableCamera');
            btn.textContent = 'Ativar Camera'; btn.style.background = '#E63946'; btn.onclick = startCamera;
        }

        function onHandResults(results) {
            allFingers = [];
            allHandLandmarks = [];

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (let handIdx = 0; handIdx < results.multiHandLandmarks.length; handIdx++) {
                    const lm = results.multiHandLandmarks[handIdx];

                    // Convert to canvas coordinates (mirrored)
                    const landmarks = lm.map(p => ({
                        x: (1 - p.x) * canvas.width,
                        y: p.y * canvas.height,
                        z: (p.z || 0) * -1
                    }));
                    allHandLandmarks.push(landmarks);

                    const tipIndices = [4, 8, 12, 16, 20];
                    for (let tipIdx of tipIndices) {
                        allFingers.push({ x: landmarks[tipIdx].x, y: landmarks[tipIdx].y, z: landmarks[tipIdx].z, handIndex: handIdx, fingerIndex: tipIdx });
                    }
                }
            }
        }

        function animate() {
            if (!isRunning) return;
            render();
            requestAnimationFrame(animate);
        }

        // ============================================
        // UI CONTROLS
        // ============================================
        function updateSliders() {
            CONFIG.elasticity = parseFloat(document.getElementById('elasticity').value);
            CONFIG.gridDensity = parseInt(document.getElementById('gridDensity').value);
            CONFIG.captureRadius = parseInt(document.getElementById('captureRadius').value);
            CONFIG.videoOpacity = parseInt(document.getElementById('videoOpacity').value) / 100;
            CONFIG.trackingOpacity = parseInt(document.getElementById('trackingOpacity').value) / 100;
            document.getElementById('elasticity-value').textContent = CONFIG.elasticity.toFixed(2);
            document.getElementById('density-value').textContent = CONFIG.gridDensity;
            document.getElementById('capture-value').textContent = CONFIG.captureRadius;
            document.getElementById('opacity-value').textContent = document.getElementById('videoOpacity').value + '%';
            document.getElementById('tracking-opacity-value').textContent = document.getElementById('trackingOpacity').value + '%';
            webcam.style.opacity = CONFIG.videoOpacity;
        }

        function onEffectChange() {
            currentEffect = document.getElementById('handEffect').value;
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            canvas = document.getElementById('mainCanvas');
            ctx = canvas.getContext('2d');
            webcam = document.getElementById('webcam');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createGrid();

            // Menu
            const menuToggle = document.getElementById('menuToggle');
            const controlsPanel = document.getElementById('controls');
            menuToggle.addEventListener('click', (e) => { e.stopPropagation(); menuToggle.classList.toggle('open'); controlsPanel.classList.toggle('visible'); });
            document.addEventListener('click', (e) => { if (!controlsPanel.contains(e.target) && !menuToggle.contains(e.target)) { menuToggle.classList.remove('open'); controlsPanel.classList.remove('visible'); } });

            // Effect selector
            document.getElementById('handEffect').addEventListener('change', onEffectChange);

            // Sliders
            document.getElementById('elasticity').addEventListener('input', () => { updateSliders(); createGrid(); });
            document.getElementById('gridDensity').addEventListener('input', () => { updateSliders(); createGrid(); });
            document.getElementById('captureRadius').addEventListener('input', updateSliders);
            document.getElementById('videoOpacity').addEventListener('input', updateSliders);
            document.getElementById('trackingOpacity').addEventListener('input', updateSliders);

            // Camera
            document.getElementById('enableCamera').addEventListener('click', startCamera);

            // Resize
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; createGrid(); });
        }

        init();
    </script>
</body>
</html>
